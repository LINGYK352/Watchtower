<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="never" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>瞭望塔 Watchtower</title>
    <script>
      /* 防刷新闪白：在 CSS/Vue 加载前先按持久化主题设 data-theme。默认夜间：未存过或非 light 一律 dark，仅显式 light 才浅色（与 useTheme.read 口径一致）。 */
      try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
