# 瞭望塔 Watchtower Nginx 入口（容器内 /etc/nginx/conf.d/default.conf）。
# 前端静态产物走挂载卷 /usr/share/nginx/html（= 宿主机 docker/frontend，热更补丁即生效）；
# /api 反代到 web 容器 5013。5555 对外（HTTPS 自签，生产换真证书）。
server {
    listen 5555;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    # 内容哈希命名的静态产物（assets/xxx-<hash>.js|css）→ 长期不可变缓存（文件名变=内容变，安全）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # SPA 入口 index.html 显式禁缓存（关键）：放独立 location 精确匹配，保证无论直接请求还是
    # try_files 内部回退都带禁缓存头——原来只在 location / 加 add_header，SPA 路由(如 /system-extensions)
    # 走 try_files 回退到 index.html 时 add_header 不一定生效，导致浏览器缓存旧入口引用旧 chunk，
    # 升级后新旧产物错配→按钮点击等事件绑定失效（2026-08-18 用户实测"更新后系统扩展按钮点不动"根因）。
    # no-store 比 no-cache 更硬：连协商缓存都不留，杜绝旧入口残留。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    # web 未就绪窗口（重启/重建/热更重载几十秒）→ 返回友好 JSON 而非裸 502，前端可据此提示「服务重启中，请稍候」
    # 并自愈重试，而不是把瞬时抖动暴露成刺眼错误（2026-09-13 事故：recreate web 期间用户吃满屏 502）。
    error_page 502 503 504 = @svc_unready;
    location @svc_unready {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 503 '{"code":503,"message":"服务重启中，请稍候重试","data":null}';
    }
    location / {
        try_files $uri $uri/ /index.html;            # SPA 前端路由回退
        add_header Cache-Control "no-cache";
    }
    # Docker 内嵌 DNS（127.0.0.11）+ 变量 upstream：让 nginx **每次请求动态解析** web 容器 IP。
    # 根治「recreate web 换 IP → nginx 仍用启动时缓存的旧 IP → connect refused 全 502」经典坑
    # （2026-09-13 事故：docker compose up -d 重建 web 后 nginx 未重启，转发旧 IP 172.19.0.7 全 502）。
    # 关键：proxy_pass 用变量时 nginx 不再从字面量解析→只在请求时经 resolver 查，valid=10s 兼顾时效与性能。
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $web_upstream web;
        proxy_pass http://$web_upstream:5013;        # 变量 upstream → 动态解析；无 URI 后缀=透传原始 /api/... 路径
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;                    # SSE 实时观察长连接(会话可能跑很久)
        # SSE 友好：关缓冲(否则 nginx 攒够才下发,失去实时)+ HTTP/1.1 长连接。后端 text/event-stream
        # 会带 X-Accel-Buffering:no,这里再显式关一层,双保险。普通 JSON 请求不受影响。
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /swaggerui/ {
        set $web_swagger web;
        proxy_pass http://$web_swagger:5013;         # 同 /api/：变量 upstream 动态解析，透传原始路径
    }
}
